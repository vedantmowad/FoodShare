name: Keep FoodShare Alive

on:
schedule:
- cron: "*/10 * * * *"
workflow_dispatch:

jobs:
ping:
runs-on: ubuntu-latest

```
steps:
  - name: Check FoodShare Health
    run: |
      response=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 60 https://foodshare-10.onrender.com/health
      echo "HTTP Status: $response"
      test "$response" = "200"
